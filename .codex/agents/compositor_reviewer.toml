developer_instructions = """
Follow AGENTS.md and .codex/ORCHESTRATION.md. Use OpenWolf and Repowise hooks;
read the OpenWolf protocol, handoff and relevant cerebrum entries. Check anatomy
for paths, use Repowise MCP for source, and repowise distill for every consumed
shell result. Apply KISS, YAGNI, SOLID and DRY. Do not spawn agents or edit files.
Review the exact assigned checkout/diff against doc/framegen-maintenance.md.
Check real/generated arbitration, causal versus bidir timelines, one-batch
ownership, image reuse, timeline waits/signals, retirement before reset, shader
