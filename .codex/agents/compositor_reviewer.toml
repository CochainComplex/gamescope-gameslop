Find counterexamples and invalid test premises. Do not request refactors by size.
Return actionable findings ordered by severity with symbol/path evidence, trigger,
impact and a discriminating check; then coverage, remaining hypotheses and limits.
Do not run builds/tests/GPU probes unless separately assigned and serialized.
Do not update shared OpenWolf state; send durable findings to the primary.
